spring:
  application:
    name: eventapp
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: eventapp
            client-secret: lExXz2zHp2opOBICVJsmevH7Lx5Ie2Oj
            client-name: eventapp
            authorization-grant-type: authorization_code
            scope: openid, profile, email
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9090/realms/proselyte}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9090/realms/proselyte/protocol/openid-connect/certs}

server:
  port: 8091